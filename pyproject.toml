[project]
name = "wyoming-parakeet-silero-wrapper"
version = "0.1.0"
description = "Wyoming wrapper for Parakeet and Silero - a drop-in replacement for faster-whisper in Home Assistant"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    # Core Wyoming Protocol
    "wyoming>=1.7.0",

    # Audio Processing
    "soundfile>=0.12.1",
    "numpy>=1.21.0",

    # Machine Learning Framework
    "torch>=1.11.0",
    "torchaudio>=0.11.0",

    # Silero VAD
    "silero-vad>=4.0.0",

    # Configuration
    "PyYAML>=6.0",

    # ASR Backends
    "nemo-toolkit[asr]>=1.18.0",
    "faster-whisper>=0.9.0",

    # ONNX Runtime
    "onnx==1.18.0",
    "onnxruntime>=1.15.0",

    # Async utilities
    "asyncio-mqtt>=0.11.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.15.0",
    "cuda-python>=12.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
